name: Deploy to VPS

# Runs on every push to main: SSHes into the Contabo VPS (wepowerenergysolutions.com)
# and runs ~/deploy-wepower.sh, which pulls main and syncs it into the live site.
# The script never touches config/config.php or uploads/, so the live DB
# credentials and real uploaded files (resumes/logos) are never overwritten.
# The key in VPS_DEPLOY_KEY is restricted on the server to running that script only.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you also trigger a deploy manually from the Actions tab

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          ssh-keyscan -H 185.211.6.213 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/vps_deploy deploy@185.211.6.213 deploy
