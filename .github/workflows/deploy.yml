name: Deploy to Hostinger

# Runs on every push to main — syncs the repo to your Hostinger hosting via FTPS.
# Excludes config/config.php and uploads/ so live DB credentials and real
# uploaded files (resumes/logos) are never touched by an automated deploy.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you also trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }} # e.g. /public_html/ or /domains/yourdomain.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config/config.php
            **/uploads/**
            **/database/**
            **/*.md
            **/node_modules/**
